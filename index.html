<script>
var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxjuAnaMshKcnqyeCJyWgmWWv2zaARIfUEKqcFJ_AkwlXFet_kNu9LJd5iCY9nPwsHu/exec';

var STATUSES=['New','To listen','Love','Decent','Pass','Delete'];
var FILTERS=['New','To listen','Love','Decent','Pass','All'];
var FORMATS=['Vinyl','CD','Digital','Stream'];
var ROTATION_DAYS=30;

var STATE={ rows:[], baseline:'', rotation:[], dismissed:[],
  picks:[], picksLoaded:false, picksLoading:false,
  newtome:[], newtomeLoaded:false, newtomeLoading:false,
  similar:[], similarLoaded:false, similarLoading:false,
  deep:{active:null, pending:null, past:[], pastLoaded:false, openPast:null},
  listen:{queue:[], index:0},

var ytReady=false, ytPlayer=null;
window.onYouTubeIframeAPIReady=function(){ ytReady=true; if(STATE.section==='listen') listenStart(); };

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove('show');},2600); }
function fmtNum(n){ n=Number(n)||0; if(n>=1e6) return (n/1e6).toFixed(1).replace(/\.0$/,'')+'M'; if(n>=1e3) return (n/1e3).toFixed(1).replace(/\.0$/,'')+'k'; return ''+n; }
function fixDur(d){ d=String(d||''); var m=d.match(/T(\d\d):(\d\d)/); if(m) return parseInt(m[1],10)+':'+m[2]; return d; }
function firstArtist(a){ return String(a||'').split(',')[0].trim(); }
function mkKey(artist,track){ var a=firstArtist(artist).toLowerCase().replace(/\s+/g,' '); var t=String(track||'').trim().toLowerCase().replace(/\s+/g,' '); return 'k:'+a+'::'+t; }
function bandcampUrl(r){ return 'https://bandcamp.com/search?q='+encodeURIComponent((r.Artist||'')+' '+(r.Track||'')); }
function qobuzUrl(r){ return 'https://www.qobuz.com/gb-en/search?q='+encodeURIComponent((r.Artist||'')+' '+(r.Track||'')); }
function youtubeUrl(r){ return 'https://www.youtube.com/results?search_query='+encodeURIComponent((r.Artist||'')+' '+(r.Track||'')); }
function lastfmUrl(r){ return 'https://www.last.fm/music/'+encodeURIComponent(firstArtist(r.Artist))+'/_/'+encodeURIComponent(r.Track||''); }
function linksHTML(r){ return '<span class="links"><a class="lnk bc" href="'+esc(bandcampUrl(r))+'" target="_blank" rel="noopener">BC</a><a class="lnk qo" href="'+esc(qobuzUrl(r))+'" target="_blank" rel="noopener">Qob</a><a class="lnk yt" href="'+esc(youtubeUrl(r))+'" target="_blank" rel="noopener">YT</a><a class="lnk lf" href="'+esc(lastfmUrl(r))+'" target="_blank" rel="noopener">fm</a></span>'; }

function apiGet(params){ return new Promise(function(resolve,reject){ var cb='rd_cb_'+Date.now()+'_'+Math.floor(Math.random()*9999), s=document.createElement('script'), done=false;
  window[cb]=function(d){ done=true; resolve(d); delete window[cb]; s.remove(); };
  s.onerror=function(){ reject(new Error('backend unreachable — check the script URL / redeploy')); s.remove(); };
  s.src=APPS_SCRIPT_URL+'?callback='+cb+'&t='+Date.now()+(params?('&'+params):''); document.body.appendChild(s);
  setTimeout(function(){ if(!done){ reject(new Error('backend timed out')); try{s.remove();}catch(e){} } },25000); }); }
function readSheet(){ return apiGet(''); }
function writeSheet(p){ return fetch(APPS_SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)}); }

function lfmKey(r){ return firstArtist(r.Artist)+'~~'+(r.Track||''); }
async function enrichTracks(rows){ try{ if(!rows.length) return; for(var i=0;i<rows.length;i+=12){ var chunk=rows.slice(i,i+12), q=chunk.map(lfmKey).join('||'); var data=await apiGet('action=enrich&q='+encodeURIComponent(q)); if(data&&data.rows){ toast('Backend out of date — redeploy Code.gs'); return; } chunk.forEach(function(r){ var d=data&&data[lfmKey(r)]; if(d){ r.Genres=(d.tags||[]).join(', '); r.Plays=d.plays||0; r.Listeners=d.listeners||0; if(d.art) r.Art=d.art; } }); } }catch(e){} }

function mapLoved(o){ return {Source:'Loved',Artist:o.artist||'',Track:o.track||'',Album:o.album||'',Year:o.year||'',Duration:o.duration||'',Popularity:'',Genres:'',Plays:0,Listeners:0,URI:mkKey(o.artist,o.track),URL:'',Art:o.art||'',ArtistIds:'',Note:'',YT:''}; }
async function doSync(btn){ if(btn){ btn.disabled=true; var sv=btn.querySelector('svg'); if(sv) sv.classList.add('spin'); }
  try{ var before=STATE.rows.length;
    try{ var sheet=await readSheet(); if(sheet){ var sr=(sheet.rows||[]); sr.reverse(); var ss={}, sd=[]; sr.forEach(function(r){ var k=r.URI||mkKey(r.Artist,r.Track); if(!ss[k]){ ss[k]=1; sd.push(r); } }); STATE.rows=sd; if(sheet.rotation) STATE.rotation=sheet.rotation; if(sheet.dismissed) STATE.dismissed=sheet.dismissed; if(sheet.baseline) STATE.baseline=sheet.baseline; render(); } }catch(e){}
    var arrived=Math.max(0, STATE.rows.length-before);
    var sinceUts=STATE.baseline?Math.floor(Date.parse(STATE.baseline)/1000):0;
    var existing={}; STATE.rows.forEach(function(r){ if(r.URI) existing[r.URI]=1; });
    var resp=await apiGet('action=loved&since='+sinceUts);
    var lovedRows=((resp&&resp.tracks)||[]).map(mapLoved);
    var seen={}, fresh=[]; lovedRows.forEach(function(t){ if(t.URI&&!existing[t.URI]&&!seen[t.URI]){ seen[t.URI]=1; fresh.push(t); } });
    if(fresh.length){ await enrichTracks(fresh); var today=new Date().toISOString().slice(0,10); fresh.forEach(function(t){ t.Status='New'; t.Date=today; }); await writeSheet({action:'add',rows:fresh}); STATE.rows=fresh.concat(STATE.rows); render(); }
    var totalNew=fresh.length+arrived;
    if(totalNew){ var bits=[]; if(fresh.length) bits.push(fresh.length+' loved'); if(arrived) bits.push(arrived+' Shazam'); toast(totalNew+' new — '+bits.join(', ')); } else toast('Up to date — nothing new');
    var needsEnrich=function(r){ return !r.Listeners && !(r.Genres&&String(r.Genres).length) && !Number(r.Plays); };
    var needsArt=function(r){ return !r.Art || /i\.scdn\.co/.test(String(r.Art)); };
    var stale=STATE.rows.filter(function(r){ return r.URI && (needsEnrich(r)||needsArt(r)); });
    if(stale.length){ await enrichTracks(stale); stale.forEach(function(r){ writeSheet({action:'updateEnrichment',uri:r.URI,genres:r.Genres||'',plays:r.Plays||0,listeners:r.Listeners||0,art:r.Art||''}); }); render(); }
    runExpiry();
  }catch(e){ toast('Sync error: '+((e&&e.message)||e)); }
  finally{ if(btn){ btn.disabled=false; var s2=btn.querySelector('svg'); if(s2) s2.classList.remove('spin'); } } }

    else{ past='<div class="list"><div class="secnote" style="padding:4px 0 10px">PAST SESSIONS</div>'+order.map(function(id){ var g=groups[id];
      if(STATE.deep.openPast===id){ var rows=g.tracks.slice().sort(function(a,b){return (a.No||0)-(b.No||0);}); var inner=rows.map(function(t){ var st=Number(t.Stars)||0; var ss='★'.repeat(st)+'☆'.repeat(Math.max(0,3-st)); return '<div class="dcard done"><div class="dtop"><span class="dno">'+esc(t.No)+'</span><span class="dtrack">'+esc(t.Track)+'</span><span class="ddur" style="color:var(--accent-ink)">'+ss+'</span></div>'+(t.Note?'<div class="notetext">'+esc(t.Note)+'</div>':'')+'</div>'; }).join('');
        return '<div class="past" data-act="past-close" data-id="'+esc(id)+'"><div class="pa">'+esc(g.album)+'</div><div class="pm">'+esc(g.artist)+' · '+esc(g.date)+' · '+esc(g.format)+' · TAP TO CLOSE</div></div>'+inner; }
      return '<div class="past" data-act="past-open" data-id="'+esc(id)+'"><div class="pa">'+esc(g.album)+'</div><div class="pm">'+esc(g.artist)+' · '+esc(g.date)+' · '+esc(g.format)+' · '+g.tracks.length+' TRACKS</div></div>'; }).join('')+'</div>'; } }
  return search+past; }

function sectionTabsHTML(c){ var defs=[['inbox','Inbox',false],['rotation','Rotation',false],['listen','Listen',false],['picks','Picks',true],['newtome','New to me',true],['similar','Similar',true],['deep','Deep Listen',true]];
  return defs.map(function(d){ var id=d[0],label=d[1],disc=d[2],ct='';
    if(id==='inbox') ct=c['New']||0; else if(id==='rotation') ct=STATE.rotation.length; else if(id==='listen') ct=c['To listen']||0;
    else if(id==='picks') ct=STATE.picksLoaded?STATE.picks.length:''; else if(id==='newtome') ct=STATE.newtomeLoaded?STATE.newtome.length:''; else if(id==='similar') ct=STATE.similarLoaded?STATE.similar.length:'';
    var mark=disc?'\u2726 ':''; return '<button class="tab'+(STATE.section===id?' on':'')+(disc?' disc':'')+'" onclick="goSection(\''+id+'\')">'+mark+esc(label)+(ct!==''?' <span class="ct">'+ct+'</span>':'')+'</button>'; }).join(''); }
function chipsHTML(c){ return '<div class="chips">'+FILTERS.map(function(f){ var ct=(f==='All')?STATE.rows.length:(c[f]||0); return '<button class="chip'+(STATE.statusFilter===f?' on':'')+'" onclick="setFilter(\''+f+'\')">'+f+' <span class="chipct">'+ct+'</span></button>'; }).join('')+'</div>'; }

function render(){ var app=document.getElementById('app');
  if(APPS_SCRIPT_URL.indexOf('PASTE_')===0){ app.innerHTML='<div class="connect"><div class="wordmark">Recent Decents</div><p>Paste your Apps Script web app URL into APPS_SCRIPT_URL at the top of this file, then reload.</p></div>'; return; }
  if(!STATE.baseline){ app.innerHTML='<div class="connect"><div class="wordmark">Start from now</div><p>Recent Decents pulls in tracks you <b>heart on Last.fm</b> (and Shazam) <b>from this point on</b>.</p><button onclick="startFresh()">Start from now</button></div>'; return; }
  var c=counts(), body='', chipBar='';
  if(STATE.section==='inbox'){ chipBar=chipsHTML(c); var rows=STATE.rows.filter(function(r){ return STATE.statusFilter==='All'?true:(r.Status||'New')===STATE.statusFilter; }); body='<div class="list">'+(rows.length?rows.map(cardHTML).join(''):'<div class="empty">'+(STATE.statusFilter==='New'?'inbox is clear<br>heart something on last.fm, then tap sync':'nothing in '+esc(STATE.statusFilter.toLowerCase()))+'</div>')+'</div>'; }
  else if(STATE.section==='rotation'){ var rot=STATE.rotation.slice().sort(function(a,b){return Date.parse(b.Added||0)-Date.parse(a.Added||0);}); body='<div class="list">'+(rot.length?rot.map(rotationCardHTML).join(''):'<div class="empty">on rotation is empty<br>mark something Love, or add a pick</div>')+'</div>'; }
  else if(STATE.section==='listen'){ body=listenSectionHTML(); }
  else if(STATE.section==='picks'){ body='<div class="list">'+(STATE.picksLoading?'<div class="empty">finding this month\u2019s picks…</div>':(!STATE.picks.length?'<div class="empty">no new picks right now<br>everything you\u2019re playing is already sorted</div>':STATE.picks.map(pickCardHTML).join('')))+'</div>'; }
  else if(STATE.section==='newtome'){ body='<div class="list">'+(STATE.newtomeLoading?'<div class="empty">finding new-to-me…</div>':(!STATE.newtome.length?'<div class="empty">nothing new surfaced<br>no recent plays from unfamiliar artists</div>':STATE.newtome.map(newToMeCardHTML).join('')))+'</div>'; }
  else if(STATE.section==='similar'){ body='<div class="list">'+(STATE.similarLoading?'<div class="empty">finding similar artists…</div>':(!STATE.similar.length?'<div class="empty">no fresh similar artists<br>everything close is already in your world</div>':STATE.similar.map(similarCardHTML).join('')))+'</div>'; }
  else { body=deepSectionHTML(); }
  var dock=(STATE.section==='deep'||STATE.section==='listen')?'':'<div class="dock"><button class="add-toggle" onclick="STATE.addOpen=!STATE.addOpen;render()">+ Add a track</button><div class="add-panel'+(STATE.addOpen?' open':'')+'"><div class="search-row"><input id="q" placeholder="Artist or track…" onkeydown="if(event.key===\'Enter\')runSearch()"><button onclick="runSearch()">Search</button></div><div class="results" id="results"></div></div><div class="tools"><button onclick="checkConnection()">Check connection</button><button onclick="resetBaseline()">Reset start point</button></div></div>';
  app.innerHTML='<div class="face"><div class="face-top"><div><div class="wordmark">Recent Decents</div><div class="sub">discovery inbox</div></div><button class="sync-btn" onclick="doSync(this)"><svg viewBox="0 0 16 16" fill="none"><path d="M14 8a6 6 0 1 1-1.8-4.3M14 2v3.5h-3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Sync</button></div></div><div class="tabs">'+sectionTabsHTML(c)+'</div>'+chipBar+body+dock;
  if(STATE.noteEdit||STATE.deepNoteEdit){ var ta=document.querySelector('textarea[data-noteinput]'); if(ta){ ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length); } }
  if(STATE.section==='listen' && ytReady && STATE.ytOn && STATE.listen.queue.length){ destroyPlayer(); listenStart(); }
}

function goSection(s){ if(STATE.section==='listen' && s!=='listen') destroyPlayer();
  if(s==='inbox') STATE.statusFilter='New';
  if(s==='listen'){ STATE.listen.queue=STATE.rows.filter(function(r){return (r.Status||'New')==='To listen';}); STATE.listen.index=0; }
  STATE.section=s; STATE.deep.openPast=null; render();
  if(s==='picks' && !STATE.picksLoading) loadPicks();
  if(s==='newtome' && !STATE.newtomeLoading) loadNewToMe();
  if(s==='similar' && !STATE.similarLoading) loadSimilar();
  if(s==='deep' && !STATE.deep.active && !STATE.deep.pastLoaded) loadDeepPast();
}
function setFilter(f){ STATE.statusFilter=f; render(); }

function appClick(e){ var el=e.target.closest('[data-act]'); if(!el) return; var act=el.getAttribute('data-act'),uri=el.getAttribute('data-uri')||'',no=el.getAttribute('data-no'),i=el.getAttribute('data-i'),f=el.getAttribute('data-f'),id=el.getAttribute('data-id');
  if(act==='accept-pick') acceptPick(uri); else if(act==='dismiss-pick') dismissPick(uri);
  else if(act==='accept-ntm') acceptNewToMe(uri); else if(act==='dismiss-ntm') dismissNewToMe(uri);
  else if(act==='accept-sim') acceptSimilar(uri); else if(act==='dismiss-sim') dismissSimilar(uri);
  else if(act==='add-manual') addManual(uri); else if(act==='rot-remove') removeFromRotation(uri);
  else if(act==='note-edit'){ STATE.noteEdit=uri; STATE.deepNoteEdit=null; render(); }
  else if(act==='note-cancel'){ STATE.noteEdit=null; render(); }
  else if(act==='note-save'){ var t=el.closest('.noteedit').querySelector('textarea'); saveNote(uri,t?t.value:''); }
  else if(act==='listen-jump') listenJump(Number(i));
  else if(act==='deep-begin') chooseDeep(i); else if(act==='album-scrobble') albumScrobble(i);
  else if(act==='deep-fmt') beginDeepListen(f); else if(act==='deep-cancel'){ STATE.deep.pending=null; render(); }
  else if(act==='deep-end') endDeepListen(); else if(act==='deep-star') deepStar(no,Number(el.getAttribute('data-n')));
  else if(act==='dnote-edit'){ STATE.deepNoteEdit=String(no); STATE.noteEdit=null; render(); }
  else if(act==='dnote-cancel'){ STATE.deepNoteEdit=null; render(); }
  else if(act==='dnote-save'){ var d=el.closest('.noteedit').querySelector('textarea'); saveDeepNote(no,d?d.value:''); }
  else if(act==='past-open'){ STATE.deep.openPast=id; render(); } else if(act==='past-close'){ STATE.deep.openPast=null; render(); }
}
function appChange(e){ var sel=e.target.closest('select.status'); if(!sel) return; setStatus(sel.getAttribute('data-uri'),sel.value); }

function checkConnection(){ toast('Checking…'); apiGet('action=ping').then(function(d){ STATE.scrobbleOn=!!(d&&d.scrobble); STATE.ytOn=!!(d&&d.youtube); toast(d&&d.ok?('Last.fm '+(d.lastfm?'OK':'no resp')+' · scrobble '+(d.scrobble?'ON':'off')+' · YouTube '+(d.youtube?'ON':'off')):'odd response'); }).catch(function(e){ toast('Backend error: '+((e&&e.message)||e)); }); }
function resetBaseline(){ if(!confirm('Reset the "start from now" point?')) return; STATE.baseline=''; render(); }

(function(){ var app=document.getElementById('app'); app.addEventListener('click',appClick); app.addEventListener('change',appChange); })();
(async function(){ if(APPS_SCRIPT_URL.indexOf('PASTE_')===0){ render(); return; }
  try{ var d=await readSheet(); var rows=(d&&d.rows)||[]; rows.reverse(); var seen={},dd=[]; rows.forEach(function(r){ var k=r.URI||mkKey(r.Artist,r.Track); if(!seen[k]){ seen[k]=1; dd.push(r); } }); STATE.rows=dd; STATE.baseline=(d&&d.baseline)||''; STATE.rotation=(d&&d.rotation)||[]; STATE.dismissed=(d&&d.dismissed)||[]; }catch(e){}
  render(); if(STATE.baseline) runExpiry();
  try{ var p=await apiGet('action=ping'); STATE.scrobbleOn=!!(p&&p.scrobble); STATE.ytOn=!!(p&&p.youtube); }catch(e){}
})();
</script>
</body>
