<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16130F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2316130F'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='%23E08A3C' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='4' fill='%23E08A3C'/%3E%3C/svg%3E">
<title>Recent Decents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,600&family=Inter:wght@400;500&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#16130F; --panel:#1E1A15; --card:#241F19;
    --line:rgba(237,230,216,0.10); --line-2:rgba(237,230,216,0.18);
    --ink:#EDE6D8; --ink-2:#A89E90; --ink-3:#6F665B;
    --accent:#E08A3C; --accent-ink:#F0B071; --accent-soft:rgba(224,138,60,0.16);
    --violet:#A99FD4; --violet-soft:rgba(150,140,200,0.16);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;
    min-height:100vh;-webkit-font-smoothing:antialiased;padding-bottom:40px}
  .wrap{max-width:480px;margin:0 auto}

  /* faceplate */
  .face{background:var(--panel);padding:20px 20px 15px;border-bottom:1px solid var(--line);position:relative}
  .face::after{content:"";position:absolute;left:20px;right:20px;bottom:-1px;height:1px;
    background:linear-gradient(90deg,var(--line-2),transparent)}
  .face-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .wordmark{font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:27px;letter-spacing:0.005em;line-height:1}
  .sub{font-family:'Space Mono',monospace;font-size:10px;color:var(--ink-2);letter-spacing:0.12em;text-transform:uppercase;margin-top:6px}
  .sync-btn{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;
    color:var(--accent-ink);background:var(--accent-soft);border:1px solid var(--accent);border-radius:100px;
    padding:7px 14px;cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap}
  .sync-btn:disabled{opacity:0.5}
  .sync-btn svg{width:13px;height:13px}
  .spin{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* section tabs */
  .tabs{display:flex;gap:0;padding:12px 20px 0;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.06em;text-transform:uppercase;
    color:var(--ink-2);padding:9px 13px 11px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;
    display:flex;align-items:center;gap:6px;background:none;border-top:none;border-left:none;border-right:none}
  .tab .ct{font-size:10px;color:var(--ink-3)}
  .tab.on{color:var(--ink);border-bottom-color:var(--accent)}
  .tab.on .ct{color:var(--accent-ink)}
  .tab.disc{color:var(--violet)}
  .tab.disc.on{border-bottom-color:var(--violet)}
  .tab.disc.on .ct{color:var(--violet)}

  /* status filter chips (inside Inbox) */
  .chips{display:flex;gap:7px;padding:11px 14px 2px;overflow-x:auto;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.04em;text-transform:uppercase;
    color:var(--ink-2);background:transparent;border:1px solid var(--line-2);border-radius:100px;padding:5px 12px;cursor:pointer;white-space:nowrap}
  .chip.on{color:#16130F;background:var(--accent);border-color:var(--accent);font-weight:700}

  .list{padding:12px 14px 4px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:9px;display:flex;gap:12px}
  .sleeve{width:56px;height:56px;border-radius:5px;flex:0 0 auto;object-fit:cover;background:#33291f;
    display:flex;align-items:center;justify-content:center;border:1px solid rgba(0,0,0,0.35)}
  .sleeve-fallback{font-family:'Fraunces',serif;font-weight:600;font-size:22px;color:rgba(255,255,255,0.8)}
  .cbody{flex:1;min-width:0}
  .crow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .artist{font-family:'Fraunces',serif;font-weight:600;font-size:16px;line-height:1.2;color:var(--ink)}
  .track{font-size:12.5px;color:var(--ink-2);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta{font-family:'Space Mono',monospace;font-size:9.5px;color:var(--ink-3);letter-spacing:0.03em;margin-top:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tags{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:9px}
  .src{font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:0.05em;text-transform:uppercase;padding:2px 7px;border-radius:4px}
  .src.Shazam{background:rgba(224,138,60,0.14);color:#E2A268}
  .src.Loved{background:rgba(63,168,154,0.14);color:#6FC4B7}
  .src.Found{background:rgba(150,140,200,0.14);color:#A99FD4}
  .src.Heavy{background:rgba(224,138,60,0.14);color:#E2A268}
  .src.Manual{background:rgba(237,230,216,0.08);color:var(--ink-2)}
  .genre{font-size:10px;color:var(--ink-3);padding:2px 7px;border:1px solid var(--line);border-radius:4px;white-space:nowrap}
  .plays{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.04em;padding:2px 7px;border-radius:4px;
    background:var(--accent-soft);color:var(--accent-ink)}
  .lis{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.04em;padding:2px 7px;border-radius:4px;
    color:var(--ink-2);border:1px solid var(--line)}
  .pick-add{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.05em;padding:7px 14px;border-radius:100px;
    background:var(--accent);color:#16130F;border:none;cursor:pointer;font-weight:700}
  .pick-add.v{background:var(--violet);color:#1b1622}
  .pick-dismiss{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.05em;padding:7px 13px;border-radius:100px;
    background:transparent;color:var(--ink-2);border:1px solid var(--line-2);cursor:pointer}
  .tools{display:flex;gap:8px;margin-top:12px}
  .links{display:inline-flex;gap:6px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
  .lnk{font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:0.04em;text-transform:uppercase;
    text-decoration:none;padding:2px 8px;border-radius:4px;border:1px solid var(--line-2)}
  .lnk.bc{color:#E2A268}
  .lnk.qo{color:#A99FD4}
  .lnk.yt{color:#D98A8A}
  .lnk.lf{color:#6FC4B7}
  .lnk:hover{border-color:var(--accent)}
  .tools button{flex:1;font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:0.06em;text-transform:uppercase;
    padding:10px;border-radius:10px;background:transparent;border:1px solid var(--line);color:var(--ink-3);cursor:pointer}
  .tools button:hover{border-color:var(--accent);color:var(--accent-ink)}

  select.status{flex:0 0 auto;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.05em;text-transform:uppercase;
    padding:5px 8px;border-radius:100px;border:1px solid var(--line-2);color:var(--ink-2);background:var(--panel);cursor:pointer;
    -webkit-appearance:none;appearance:none;text-align:center}
  select.status[data-s="New"]{border-style:dashed}
  select.status[data-s="To listen"],select.status[data-s="Love"]{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}

  /* manual add */
  .dock{padding:10px 14px 20px}
  .add-toggle{width:100%;display:flex;align-items:center;justify-content:center;gap:9px;background:transparent;
    border:1px dashed var(--line-2);border-radius:12px;padding:13px;color:var(--ink-2);
    font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer}
  .add-toggle:hover{border-color:var(--accent);color:var(--accent-ink)}
  .add-panel{display:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;margin-top:9px}
  .add-panel.open{display:block}
  .search-row{display:flex;gap:8px}
  .search-row input{flex:1;background:var(--panel);border:1px solid var(--line-2);border-radius:8px;color:var(--ink);
    font-family:'Inter',sans-serif;font-size:14px;padding:9px 12px}
  .search-row input:focus{outline:none;border-color:var(--accent)}
  .search-row button{background:var(--accent-soft);border:1px solid var(--accent);color:var(--accent-ink);border-radius:8px;
    font-family:'Space Mono',monospace;font-size:12px;padding:0 16px;cursor:pointer}
  .results{margin-top:10px}
  .result{display:flex;gap:11px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
  .result img{width:40px;height:40px;border-radius:4px;flex:0 0 auto;background:#33291f}
  .result .ri{flex:1;min-width:0}
  .result .ra{font-family:'Fraunces',serif;font-weight:600;font-size:14px}
  .result .rt{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .result button{flex:0 0 auto;background:transparent;border:1px solid var(--line-2);color:var(--ink);border-radius:100px;
    font-family:'Space Mono',monospace;font-size:11px;padding:6px 13px;cursor:pointer}

  /* intro / start screen */
  .connect{padding:60px 28px;text-align:center;max-width:440px;margin:0 auto}
  .connect .wordmark{font-size:38px;margin-bottom:6px}
  .connect p{color:var(--ink-2);font-size:14px;line-height:1.7;margin:14px 0 28px}
  .connect button{background:var(--accent);color:#16130F;border:none;border-radius:100px;font-family:'Space Mono',monospace;
    font-size:13px;letter-spacing:0.06em;padding:14px 28px;cursor:pointer;font-weight:700}

  .empty{text-align:center;color:var(--ink-3);font-family:'Space Mono',monospace;font-size:12px;letter-spacing:0.06em;padding:50px 20px;line-height:1.8}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--accent);
    color:var(--ink);font-size:13px;padding:11px 18px;border-radius:100px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50;
    max-width:90%;text-align:center}
  .toast.show{opacity:1}
  .hidden{display:none !important}
</style>
</head>
<body>

<div id="app" class="wrap"></div>
<div id="toast" class="toast"></div>

<script>
/* ============================================================
   ONE value to paste — your Apps Script web app URL (the /exec link).
   Nothing else. The Last.fm key lives in Code.gs on the server.
   ============================================================ */
var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxjuAnaMshKcnqyeCJyWgmWWv2zaARIfUEKqcFJ_AkwlXFet_kNu9LJd5iCY9nPwsHu/exec';
/* ============================================================ */

var STATUSES = ['New','To listen','Love','Decent','Pass','Delete'];
var FILTERS  = ['New','To listen','Love','Decent','Pass','All'];
var ROTATION_DAYS = 30;

var STATE = { rows: [], baseline: '', rotation: [], dismissed: [],
              picks: [], picksLoaded: false, picksLoading: false,
              newtome: [], newtomeLoaded: false, newtomeLoading: false,
              section: 'inbox', statusFilter: 'New', addOpen: false, _cache: {} };

/* ---------- tiny helpers ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove('show');},2600); }
function fmtNum(n){ n=Number(n)||0; if(n>=1e6) return (n/1e6).toFixed(1).replace(/\.0$/,'')+'M';
  if(n>=1e3) return (n/1e3).toFixed(1).replace(/\.0$/,'')+'k'; return ''+n; }
function fixDur(d){ d=String(d||''); var m=d.match(/T(\d\d):(\d\d)/); if(m) return parseInt(m[1],10)+':'+m[2]; return d; }
function firstArtist(a){ return String(a||'').split(',')[0].trim(); }

/* identity — MUST match mkKey_() in Code.gs exactly */
function mkKey(artist, track){
  var a=firstArtist(artist).toLowerCase().replace(/\s+/g,' ');
  var t=String(track||'').trim().toLowerCase().replace(/\s+/g,' ');
  return 'k:'+a+'::'+t;
}

/* play links — no API, just searches on the places you actually listen */
function bandcampUrl(r){ return 'https://bandcamp.com/search?q='+encodeURIComponent((r.Artist||'')+' '+(r.Track||'')); }
function qobuzUrl(r){ return 'https://www.qobuz.com/gb-en/search?q='+encodeURIComponent((r.Artist||'')+' '+(r.Track||'')); }
function youtubeUrl(r){ return 'https://www.youtube.com/results?search_query='+encodeURIComponent((r.Artist||'')+' '+(r.Track||'')); }
function lastfmUrl(r){ return 'https://www.last.fm/music/'+encodeURIComponent(firstArtist(r.Artist))+'/_/'+encodeURIComponent(r.Track||''); }
function linksHTML(r){
  return '<span class="links">'+
    '<a class="lnk bc" href="'+esc(bandcampUrl(r))+'" target="_blank" rel="noopener">BC</a>'+
    '<a class="lnk qo" href="'+esc(qobuzUrl(r))+'" target="_blank" rel="noopener">Qob</a>'+
    '<a class="lnk yt" href="'+esc(youtubeUrl(r))+'" target="_blank" rel="noopener">YT</a>'+
    '<a class="lnk lf" href="'+esc(lastfmUrl(r))+'" target="_blank" rel="noopener">fm</a></span>';
}

/* ---------- backend read (JSONP) + write (POST) ---------- */
function apiGet(params){
  return new Promise(function(resolve,reject){
    var cb='rd_cb_'+Date.now()+'_'+Math.floor(Math.random()*9999);
    var s=document.createElement('script');
    var done=false;
    window[cb]=function(data){ done=true; resolve(data); delete window[cb]; s.remove(); };
    s.onerror=function(){ reject(new Error('backend unreachable — check the script URL / redeploy')); s.remove(); };
    s.src=APPS_SCRIPT_URL+'?callback='+cb+'&t='+Date.now()+(params?('&'+params):'');
    document.body.appendChild(s);
    setTimeout(function(){ if(!done){ reject(new Error('backend timed out')); try{s.remove();}catch(e){} } }, 25000);
  });
}
function readSheet(){ return apiGet(''); }
function writeSheet(payload){
  return fetch(APPS_SCRIPT_URL,{method:'POST', mode:'no-cors',
    headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(payload)});
}

/* ---------- enrichment (Last.fm tags / plays / listeners) ---------- */
function lfmKey(r){ return firstArtist(r.Artist)+'~~'+(r.Track||''); }
async function enrichTracks(rows){
  try{
    if(!rows.length) return;
    for(var i=0;i<rows.length;i+=12){
      var chunk=rows.slice(i,i+12);
      var q=chunk.map(lfmKey).join('||');
      var data=await apiGet('action=enrich&q='+encodeURIComponent(q));
      if(data && data.rows){ toast('Backend is out of date — redeploy Code.gs as a New version'); return; }
      chunk.forEach(function(r){
        var d=data&&data[lfmKey(r)];
        if(d){ r.Genres=(d.tags||[]).join(', '); r.Plays=d.plays||0; r.Listeners=d.listeners||0; if(d.art) r.Art=d.art; }
      });
    }
  }catch(e){ /* enrichment is best-effort — never block a save */ }
}

/* ---------- capture: Last.fm Loved tracks (+ Shazam via intake) ---------- */
function mapLoved(o){
  return { Source:'Loved', Artist:o.artist||'', Track:o.track||'', Album:o.album||'',
    Year:o.year||'', Duration:o.duration||'', Popularity:'', Genres:'', Plays:0, Listeners:0,
    URI:mkKey(o.artist,o.track), URL:'', Art:o.art||'', ArtistIds:'' }; }

async function doSync(btn){
  if(btn){ btn.disabled=true; var sv=btn.querySelector('svg'); if(sv) sv.classList.add('spin'); }
  try{
    /* refresh from the sheet first — picks up Shazam rows Zapier wrote straight into Saves */
    var before=STATE.rows.length;
    try{
      var sheet=await readSheet();
      if(sheet){
        var sr=(sheet.rows||[]); sr.reverse();
        var sseen={}, sded=[];
        sr.forEach(function(r){ var k=r.URI||mkKey(r.Artist,r.Track); if(!sseen[k]){ sseen[k]=1; sded.push(r); } });
        STATE.rows=sded;
        if(sheet.rotation) STATE.rotation=sheet.rotation;
        if(sheet.dismissed) STATE.dismissed=sheet.dismissed;
        if(sheet.baseline) STATE.baseline=sheet.baseline;
        render();
      }
    }catch(e){}
    var arrived=Math.max(0, STATE.rows.length-before);

    var sinceUts = STATE.baseline ? Math.floor(Date.parse(STATE.baseline)/1000) : 0;
    var existing={}; STATE.rows.forEach(function(r){ if(r.URI) existing[r.URI]=1; });

    var resp = await apiGet('action=loved&since='+sinceUts);
    var lovedRows = ((resp&&resp.tracks)||[]).map(mapLoved);

    var seen={}, fresh=[];
    lovedRows.forEach(function(t){ if(t.URI && !existing[t.URI] && !seen[t.URI]){ seen[t.URI]=1; fresh.push(t); } });

    if(fresh.length){
      await enrichTracks(fresh);
      var today=new Date().toISOString().slice(0,10);
      fresh.forEach(function(t){ t.Status='New'; t.Date=today; });
      await writeSheet({action:'add', rows:fresh});
      STATE.rows=fresh.concat(STATE.rows);
      render();
    }

    var totalNew=fresh.length+arrived;
    if(totalNew){
      var bits=[]; if(fresh.length) bits.push(fresh.length+' loved'); if(arrived) bits.push(arrived+' Shazam');
      toast(totalNew+' new — '+bits.join(', '));
    } else {
      toast('Up to date — nothing new');
    }

    var needsEnrich=function(r){ return !r.Listeners && !(r.Genres&&String(r.Genres).length) && !Number(r.Plays); };
    var needsArt=function(r){ return !r.Art || /i\.scdn\.co/.test(String(r.Art)); };
    var stale=STATE.rows.filter(function(r){ return r.URI && (needsEnrich(r) || needsArt(r)); });
    if(stale.length){
      await enrichTracks(stale);
      stale.forEach(function(r){ writeSheet({action:'updateEnrichment', uri:r.URI, genres:r.Genres||'', plays:r.Plays||0, listeners:r.Listeners||0, art:r.Art||''}); });
      render();
    }

    runExpiry();
  }catch(e){ toast('Sync error: '+((e&&e.message)||e)); }
  finally{ if(btn){ btn.disabled=false; var sv2=btn.querySelector('svg'); if(sv2) sv2.classList.remove('spin'); } }
}

async function startFresh(){
  var now=new Date().toISOString();
  STATE.baseline=now;
  await writeSheet({action:'setBaseline', baseline:now});
  render();
}

/* ---------- On Rotation (internal — Sheet + app, 30-day expiry) ---------- */
function addToRotation(row, via){
  if(STATE.rotation.some(function(x){return x.URI===row.URI;})) return;
  var entry={URI:row.URI, Artist:row.Artist, Track:row.Track, Art:row.Art||'', Added:new Date().toISOString(), Via:via||'Love'};
  STATE.rotation.push(entry);
  writeSheet({action:'rotationAdd', uri:row.URI, artist:row.Artist, track:row.Track, added:entry.Added, via:entry.Via});
  toast('Added to On Rotation');
}
function removeFromRotation(uri){
  STATE.rotation=STATE.rotation.filter(function(x){return x.URI!==uri;});
  writeSheet({action:'rotationRemove', uri:uri});
  render();
}
function runExpiry(){
  var cutoff=Date.now()-ROTATION_DAYS*86400000;
  var due=STATE.rotation.filter(function(x){ return x.Added && Date.parse(x.Added) < cutoff; });
  if(!due.length) return;
  due.forEach(function(x){ writeSheet({action:'rotationRemove', uri:x.URI}); });
  var gone={}; due.forEach(function(x){ gone[x.URI]=1; });
  STATE.rotation=STATE.rotation.filter(function(x){ return !gone[x.URI]; });
}

/* ---------- status changes ---------- */
function setStatus(uri, status){
  if(status==='Delete'){
    if(!confirm('Remove this entry from the sheet permanently?')){ render(); return; }
    STATE.rows=STATE.rows.filter(function(x){return x.URI!==uri;});
    writeSheet({action:'deleteRow', uri:uri});
    render(); return;
  }
  var r=STATE.rows.find(function(x){return x.URI===uri;});
  if(r) r.Status=status;
  writeSheet({action:'updateStatus', uri:uri, status:status});
  render();
  if(status==='Love' && r) addToRotation(r,'Love');
}

/* ---------- Picks: heavy rotation, last 30 days ---------- */
async function loadPicks(){
  if(STATE.picksLoading) return;
  STATE.picksLoading=true; STATE.picksLoaded=true; STATE.picks=[]; render();
  try{
    var cand=await apiGet('action=picks');
    var skip={}; STATE.rotation.forEach(function(x){skip[x.URI]=1;});
    STATE.dismissed.forEach(function(u){skip[u]=1;}); STATE.rows.forEach(function(r){if(r.URI)skip[r.URI]=1;});
    var picks=[];
    (cand||[]).forEach(function(c){
      var uri=mkKey(c.artist,c.track); if(skip[uri]) return;
      picks.push({URI:uri, Artist:c.artist, Track:c.track, Plays:c.plays, Art:c.art||''});
    });
    STATE.picks=picks.slice(0,25);
  }catch(e){ toast('Could not load picks'); STATE.picks=[]; }
  finally{ STATE.picksLoading=false; render(); }
}
function acceptPick(uri){
  var m=STATE.picks.find(function(x){return x.URI===uri;}); if(!m) return;
  STATE.picks=STATE.picks.filter(function(x){return x.URI!==uri;}); render();
  addToRotation(m,'Heavy');
}
function dismissPick(uri){
  STATE.dismissed.push(uri);
  STATE.picks=STATE.picks.filter(function(x){return x.URI!==uri;});
  writeSheet({action:'dismiss', uri:uri}); render();
}

/* ---------- Passive "New to me" feed ---------- */
async function loadNewToMe(){
  if(STATE.newtomeLoading) return;
  STATE.newtomeLoading=true; STATE.newtomeLoaded=true; STATE.newtome=[]; render();
  try{
    var cand=await apiGet('action=newtome');
    var skip={}; STATE.rotation.forEach(function(x){skip[x.URI]=1;});
    STATE.dismissed.forEach(function(u){skip[u]=1;}); STATE.rows.forEach(function(r){if(r.URI)skip[r.URI]=1;});
    var out=[];
    (cand||[]).forEach(function(c){
      var uri=mkKey(c.artist,c.track); if(skip[uri]) return;
      out.push({URI:uri, Artist:c.artist, Track:c.track, Album:c.album||'', Year:c.year||'',
        Duration:c.duration||'', Art:c.art||'', UserPlays:c.userplays});
    });
    STATE.newtome=out;
  }catch(e){ toast('Could not load new-to-me'); STATE.newtome=[]; }
  finally{ STATE.newtomeLoading=false; render(); }
}
async function acceptNewToMe(uri){
  var m=STATE.newtome.find(function(x){return x.URI===uri;}); if(!m) return;
  STATE.newtome=STATE.newtome.filter(function(x){return x.URI!==uri;});
  var row={Source:'Found', Artist:m.Artist, Track:m.Track, Album:m.Album, Year:m.Year, Duration:m.Duration,
    Popularity:'', Genres:'', Plays:0, Listeners:0, URI:m.URI, URL:'', Art:m.Art, ArtistIds:'',
    Status:'New', Date:new Date().toISOString().slice(0,10)};
  await enrichTracks([row]);
  await writeSheet({action:'add', rows:[row]});
  STATE.rows=[row].concat(STATE.rows);
  toast('Added · '+row.Artist); render();
}
function dismissNewToMe(uri){
  STATE.dismissed.push(uri);
  STATE.newtome=STATE.newtome.filter(function(x){return x.URI!==uri;});
  writeSheet({action:'dismiss', uri:uri}); render();
}

/* ---------- manual add (iTunes search via backend) ---------- */
async function runSearch(){
  var q=document.getElementById('q').value.trim(); if(!q) return;
  var box=document.getElementById('results'); box.innerHTML='<p class="meta" style="padding:8px 0">searching…</p>';
  try{
    var items=await apiGet('action=isearch&q='+encodeURIComponent(q));
    if(!items||!items.length){ box.innerHTML='<p class="meta" style="padding:8px 0">no matches</p>'; return; }
    box.innerHTML=items.map(function(t){
      var uri=mkKey(t.artist,t.track);
      var m={Source:'Manual', Artist:t.artist, Track:t.track, Album:t.album||'', Year:t.year||'',
        Duration:t.duration||'', Popularity:'', Genres:'', Plays:0, Listeners:0,
        URI:uri, URL:'', Art:t.art||'', ArtistIds:''};
      STATE._cache[uri]=m;
      return '<div class="result"><img src="'+esc(m.Art)+'" alt=""><div class="ri">'+
        '<div class="ra">'+esc(m.Artist)+'</div><div class="rt">'+esc(m.Track)+' · '+esc(m.Album)+' · '+esc(m.Year)+'</div></div>'+
        '<button data-act="add-manual" data-uri="'+esc(uri)+'">add</button></div>';
    }).join('');
  }catch(e){ box.innerHTML='<p class="meta" style="padding:8px 0">search problem</p>'; }
}
async function addManual(uri){
  var m=STATE._cache&&STATE._cache[uri]; if(!m) return;
  if(STATE.rows.some(function(r){return r.URI===uri;})){ toast('Already saved'); return; }
  await enrichTracks([m]);
  m.Status='New'; m.Date=new Date().toISOString().slice(0,10);
  await writeSheet({action:'add', rows:[m]});
  STATE.rows=[m].concat(STATE.rows);
  toast('Added · '+m.Artist);
  document.getElementById('q').value=''; document.getElementById('results').innerHTML='';
  render();
}

/* ---------- render ---------- */
function counts(){ var c={All:STATE.rows.length}; STATUSES.forEach(function(s){c[s]=0;});
  STATE.rows.forEach(function(r){ var s=r.Status||'New'; if(c[s]!=null) c[s]++; }); return c; }

function cardHTML(r){
  var sleeve = r.Art ? '<img class="sleeve" src="'+esc(r.Art)+'" alt="">'
    : '<div class="sleeve"><span class="sleeve-fallback">'+esc((r.Track||r.Artist||'?').slice(0,1))+'</span></div>';
  var opts=STATUSES.map(function(s){ return '<option'+(((r.Status||'New')===s)?' selected':'')+'>'+s+'</option>'; }).join('');
  var album=String(r.Album||''); if(album.length>26) album=album.slice(0,25).trim()+'\u2026';
  var meta=[album, r.Year, fixDur(r.Duration)].filter(Boolean).join(' · ').toUpperCase();
  var listeners = (r.Listeners&&Number(r.Listeners)>0) ? fmtNum(r.Listeners)+' listeners' : '';
  var plays=Number(r.Plays)||0;
  var playsBadge = plays>0 ? '<span class="plays">▶ '+plays+'</span>' : '';
  var lisBadge = listeners ? '<span class="lis">'+esc(listeners)+'</span>' : '';
  var genres=(r.Genres||'').split(',').map(function(g){return g.trim();}).filter(Boolean)
    .map(function(g){return '<span class="genre">'+esc(g)+'</span>';}).join('');
  var srcClass=esc((r.Source||'Manual').replace(/[^A-Za-z]/g,''));
  return '<div class="card">'+sleeve+'<div class="cbody"><div class="crow"><div style="min-width:0">'+
    '<div class="artist">'+esc(r.Track)+'</div><div class="track">'+esc(r.Artist)+'</div>'+
    '<div class="meta">'+esc(meta)+'</div></div>'+
    '<select class="status" data-uri="'+esc(r.URI)+'" data-s="'+esc(r.Status||'New')+'">'+opts+'</select>'+
    '</div><div class="tags"><span class="src '+srcClass+'">'+esc(r.Source||'Manual')+'</span>'+playsBadge+lisBadge+genres+linksHTML(r)+'</div></div></div>';
}

function pickCardHTML(r){
  var sleeve = r.Art ? '<img class="sleeve" src="'+esc(r.Art)+'" alt="">'
    : '<div class="sleeve"><span class="sleeve-fallback">'+esc((r.Artist||'?').slice(0,1))+'</span></div>';
  var plays=Number(r.Plays)||0;
  return '<div class="card">'+sleeve+'<div class="cbody"><div class="crow"><div style="min-width:0">'+
    '<div class="artist">'+esc(r.Artist)+'</div><div class="track">'+esc(r.Track)+'</div>'+
    '<div class="meta">'+('▶ '+plays+' PLAYS THIS MONTH')+'</div></div></div>'+
    '<div class="tags"><button class="pick-add v" data-act="accept-pick" data-uri="'+esc(r.URI)+'">+ On Rotation</button>'+
    '<button class="pick-dismiss" data-act="dismiss-pick" data-uri="'+esc(r.URI)+'">dismiss</button></div></div></div>';
}

function newToMeCardHTML(r){
  var sleeve = r.Art ? '<img class="sleeve" src="'+esc(r.Art)+'" alt="">'
    : '<div class="sleeve"><span class="sleeve-fallback">'+esc((r.Artist||'?').slice(0,1))+'</span></div>';
  var up=Number(r.UserPlays); var pl=isNaN(up)?'':(up+' play'+(up===1?'':'s')+' all-time');
  var meta=[String(r.Album||'').slice(0,24), pl].filter(Boolean).join(' · ').toUpperCase();
  return '<div class="card">'+sleeve+'<div class="cbody"><div class="crow"><div style="min-width:0">'+
    '<div class="artist">'+esc(r.Artist)+'</div><div class="track">'+esc(r.Track)+'</div>'+
    '<div class="meta">'+esc(meta)+'</div></div></div>'+
    '<div class="tags"><button class="pick-add v" data-act="accept-ntm" data-uri="'+esc(r.URI)+'">+ Inbox</button>'+
    '<button class="pick-dismiss" data-act="dismiss-ntm" data-uri="'+esc(r.URI)+'">dismiss</button></div></div></div>';
}

function rotationCardHTML(x){
  var r={Artist:x.Artist, Track:x.Track};
  var saved=STATE.rows.find(function(s){return s.URI===x.URI;});
  var art=(x.Art)||(saved&&saved.Art)||'';
  var sleeve = art ? '<img class="sleeve" src="'+esc(art)+'" alt="">'
    : '<div class="sleeve"><span class="sleeve-fallback">'+esc((x.Track||x.Artist||'?').slice(0,1))+'</span></div>';
  var added=x.Added?new Date(x.Added):null;
  var daysLeft=added?Math.max(0,Math.ceil(ROTATION_DAYS-(Date.now()-added.getTime())/86400000)):'';
  var meta=[(x.Via||'').toUpperCase(), daysLeft!==''?(daysLeft+' DAYS LEFT'):''].filter(Boolean).join(' · ');
  return '<div class="card">'+sleeve+
    '<div class="cbody"><div class="crow"><div style="min-width:0">'+
    '<div class="artist">'+esc(x.Track)+'</div><div class="track">'+esc(x.Artist)+'</div>'+
    '<div class="meta">'+esc(meta)+'</div></div>'+
    '<button class="pick-dismiss" data-act="rot-remove" data-uri="'+esc(x.URI)+'">remove</button>'+
    '</div><div class="tags">'+linksHTML(r)+'</div></div></div>';
}

function sectionTabsHTML(c){
  var defs=[['inbox','Inbox',false],['rotation','Rotation',false],['picks','Picks',true],['newtome','New to me',true]];
  return defs.map(function(d){
    var id=d[0], label=d[1], disc=d[2];
    var ct='';
    if(id==='inbox') ct=c['New']||0;
    else if(id==='rotation') ct=STATE.rotation.length;
    else if(id==='picks') ct=STATE.picksLoaded?STATE.picks.length:'';
    else if(id==='newtome') ct=STATE.newtomeLoaded?STATE.newtome.length:'';
    var mark=disc?'\u2726 ':'';
    return '<button class="tab'+(STATE.section===id?' on':'')+(disc?' disc':'')+'" onclick="goSection(\''+id+'\')">'+mark+esc(label)+
      (ct!==''?' <span class="ct">'+ct+'</span>':'')+'</button>';
  }).join('');
}

function chipsHTML(c){
  return '<div class="chips">'+FILTERS.map(function(f){
    return '<button class="chip'+(STATE.statusFilter===f?' on':'')+'" onclick="setFilter(\''+f+'\')">'+f+'</button>';
  }).join('')+'</div>';
}

function render(){
  var app=document.getElementById('app');

  if(APPS_SCRIPT_URL.indexOf('PASTE_')===0){
    app.innerHTML='<div class="connect"><div class="wordmark">Recent Decents</div>'+
      '<p>Almost there — paste your Apps Script web app URL into <b>APPS_SCRIPT_URL</b> at the top of this file, then reload.</p></div>';
    return;
  }
  if(!STATE.baseline){
    app.innerHTML='<div class="connect"><div class="wordmark">Start from now</div>'+
      '<p>Recent Decents pulls in tracks you <b>heart on Last.fm</b> (and Shazam) <b>from this point on</b>. Your back catalogue stays untouched, so your inbox starts clean.</p>'+
      '<p style="font-size:13px;color:var(--ink-3);margin-top:-14px">Anything older you want, add it by hand any time.</p>'+
      '<button onclick="startFresh()">Start from now</button></div>';
    return;
  }

  var c=counts();
  var listHTML, chipBar='';

  if(STATE.section==='inbox'){
    chipBar=chipsHTML(c);
    var rows=STATE.rows.filter(function(r){ return STATE.statusFilter==='All' ? true : (r.Status||'New')===STATE.statusFilter; });
    if(rows.length){ listHTML=rows.map(cardHTML).join(''); }
    else if(STATE.statusFilter==='New'){ listHTML='<div class="empty">inbox is clear'+'<br>heart something on last.fm, then tap sync</div>'; }
    else { listHTML='<div class="empty">nothing in '+esc(STATE.statusFilter.toLowerCase())+'</div>'; }
  } else if(STATE.section==='rotation'){
    var rot=STATE.rotation.slice().sort(function(a,b){ return Date.parse(b.Added||0)-Date.parse(a.Added||0); });
    listHTML = rot.length ? rot.map(rotationCardHTML).join('')
      : '<div class="empty">on rotation is empty<br>mark something Love, or add a pick</div>';
  } else if(STATE.section==='picks'){
    if(STATE.picksLoading) listHTML='<div class="empty">finding this month\u2019s picks…</div>';
    else if(!STATE.picks.length) listHTML='<div class="empty">no new picks right now<br>everything you\u2019re playing is already sorted</div>';
    else listHTML=STATE.picks.map(pickCardHTML).join('');
  } else { /* newtome */
    if(STATE.newtomeLoading) listHTML='<div class="empty">finding new-to-me…</div>';
    else if(!STATE.newtome.length) listHTML='<div class="empty">nothing new surfaced<br>no recent plays from unfamiliar artists</div>';
    else listHTML=STATE.newtome.map(newToMeCardHTML).join('');
  }

  app.innerHTML=
    '<div class="face"><div class="face-top"><div><div class="wordmark">Recent Decents</div>'+
      '<div class="sub">discovery inbox</div></div>'+
      '<button class="sync-btn" onclick="doSync(this)"><svg viewBox="0 0 16 16" fill="none">'+
        '<path d="M14 8a6 6 0 1 1-1.8-4.3M14 2v3.5h-3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Sync</button>'+
    '</div></div>'+
    '<div class="tabs">'+sectionTabsHTML(c)+'</div>'+
    chipBar+
    '<div class="list">'+listHTML+'</div>'+
    '<div class="dock"><button class="add-toggle" onclick="STATE.addOpen=!STATE.addOpen;render()">+ Add a track</button>'+
      '<div class="add-panel'+(STATE.addOpen?' open':'')+'">'+
        '<div class="search-row"><input id="q" placeholder="Artist or track…" onkeydown="if(event.key===\'Enter\')runSearch()"><button onclick="runSearch()">Search</button></div>'+
        '<div class="results" id="results"></div></div>'+
      '<div class="tools"><button onclick="checkConnection()">Check connection</button>'+
        '<button onclick="resetBaseline()">Reset start point</button></div>'+
    '</div>';
}

/* ---------- navigation ---------- */
function goSection(s){
  STATE.section=s; render();
  if(s==='picks' && !STATE.picksLoading) loadPicks();
  if(s==='newtome' && !STATE.newtomeLoading) loadNewToMe();
}
function setFilter(f){ STATE.statusFilter=f; render(); }

/* ---------- delegated actions (apostrophe-safe — keys live in data-uri, never in inline JS) ---------- */
function appClick(e){
  var el=e.target.closest('[data-act]'); if(!el) return;
  var act=el.getAttribute('data-act'), uri=el.getAttribute('data-uri')||'';
  if(act==='accept-pick') acceptPick(uri);
  else if(act==='dismiss-pick') dismissPick(uri);
  else if(act==='accept-ntm') acceptNewToMe(uri);
  else if(act==='dismiss-ntm') dismissNewToMe(uri);
  else if(act==='add-manual') addManual(uri);
  else if(act==='rot-remove') removeFromRotation(uri);
}
function appChange(e){
  var sel=e.target.closest('select.status'); if(!sel) return;
  setStatus(sel.getAttribute('data-uri'), sel.value);
}

function checkConnection(){
  toast('Checking…');
  apiGet('action=ping').then(function(d){
    toast(d&&d.ok ? ('Backend OK · Last.fm '+(d.lastfm?'OK':'no response')) : 'Backend reachable, odd response');
  }).catch(function(e){ toast('Backend error: '+((e&&e.message)||e)); });
}
function resetBaseline(){
  if(!confirm('Reset the "start from now" point? Future syncs will only bring in loves from the moment you confirm.')) return;
  STATE.baseline=''; render();
}

/* ---------- start ---------- */
(function(){
  var app=document.getElementById('app');
  app.addEventListener('click', appClick);
  app.addEventListener('change', appChange);
})();

(async function(){
  if(APPS_SCRIPT_URL.indexOf('PASTE_')===0){ render(); return; }
  try{
    var d=await readSheet();
    var rows=(d&&d.rows)||[];
    rows.reverse();   /* newest first */
    var seen={}, deduped=[];
    rows.forEach(function(r){ var k=r.URI||mkKey(r.Artist,r.Track); if(!seen[k]){ seen[k]=1; deduped.push(r); } });
    STATE.rows=deduped;
    STATE.baseline=(d&&d.baseline)||'';
    STATE.rotation=(d&&d.rotation)||[];
    STATE.dismissed=(d&&d.dismissed)||[];
  }catch(e){ /* show empty; sync will populate */ }
  render();
  if(STATE.baseline) runExpiry();
})();
</script>
</body>
</html>
